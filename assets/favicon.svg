<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="Logo Simulasi CAT BKN CPNS 2027">
  <defs>
    <linearGradient id="bgGrad" x1="8" y1="4" x2="56" y2="60" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#22a7f0" />
      <stop offset="50%" stop-color="#1481c6" />
      <stop offset="100%" stop-color="#094a80" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="26" y1="7" x2="38" y2="19" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="45%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#f59e0b" />
    </linearGradient>
    <linearGradient id="checkGrad" x1="24" y1="33" x2="41" y2="45" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#1481c6" />
      <stop offset="100%" stop-color="#094a80" />
    </linearGradient>
  </defs>

  <!-- Rounded Badge Base -->
  <rect x="2" y="2" width="60" height="60" rx="16" fill="url(#bgGrad)" />
  <rect x="3" y="3" width="58" height="58" rx="15" fill="none" stroke="#ffffff" stroke-opacity="0.30" stroke-width="1.5" />

  <!-- Stylized Garuda Civic Wings -->
  <path d="M7.5 23.5 Q16 23.5 21.5 28.5 L19.5 34.5 Q12 31.5 7.5 23.5 Z" fill="#ffffff" fill-opacity="0.28" />
  <path d="M10.5 33 Q16 34 20.5 37.5 L19 42.8 Q13.5 39.5 10.5 33 Z" fill="#ffffff" fill-opacity="0.18" />
  <path d="M56.5 23.5 Q48 23.5 42.5 28.5 L44.5 34.5 Q52 31.5 56.5 23.5 Z" fill="#ffffff" fill-opacity="0.28" />
  <path d="M53.5 33 Q48 34 43.5 37.5 L45 42.8 Q50.5 39.5 53.5 33 Z" fill="#ffffff" fill-opacity="0.18" />

  <!-- Top Nusantara Gold Star -->
  <path d="M32 6.8 L34.05 11.15 L38.85 11.75 L35.3 15.1 L36.2 19.9 L32 17.55 L27.8 19.9 L28.7 15.1 L25.15 11.75 L29.95 11.15 Z"
        fill="url(#goldGrad)" />

  <!-- Bold White Civic Shield -->
  <path d="M32 21.5 L48 26.2 V36.2 C48 46.4 39.2 53.5 32 56.5 C24.8 53.5 16 46.4 16 36.2 V26.2 Z" fill="#ffffff" />

  <!-- Merah Crown Ribbon Following Shield Contour -->
  <path d="M16 26.2 L32 21.5 L48 26.2 V29.8 L32 25.1 L16 29.8 Z" fill="#e11d48" />

  <!-- Bold CAT Pass Checkmark -->
  <path d="M24 39.8 L29.6 45.2 L40.6 33.8" fill="none" stroke="url(#checkGrad)" stroke-width="5.2" stroke-linecap="round" stroke-linejoin="round" />
</svg>
